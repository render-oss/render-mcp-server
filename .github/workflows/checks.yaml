name: checks
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Go Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: true

      - name: Install dependencies
        run: go get .

      - name: Build
        run: go build -v ./...

      - name: Test with the Go CLI
        run: go test -race $(go list ./... | grep -v e2e)

  generated-fakes:
    name: Check Generated Fakes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Regenerate and check fakes
        env:
          COUNTERFEITER_NO_GENERATE_WARNING: "1"
        run: |
          # Regenerate the complete set of fakes from scratch.
          rm -f pkg/fakes/*_gen.go
          go generate ./...
          # Fail if the generated files differ from what's committed.
          git add --intent-to-add --force -- pkg/fakes
          if ! git diff --exit-code HEAD -- pkg/fakes; then
            echo "::error::Generated fakes are out of date. Run 'rm -f pkg/fakes/*_gen.go && go generate ./...' and commit the changes."
            exit 1
          fi
