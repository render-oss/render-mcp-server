---
services:
- type: web
  name: mcp
  runtime: go
  plan: 2c-8g
  scaling:
    minInstances: 3
    maxInstances: 10
    targetCPUPercent: 60
    targetMemoryPercent: 60
  buildCommand: go build -tags netgo -ldflags '-s -w' -o app
  startCommand: ./app --transport http
  envVars:
  # Let Go download the toolchain that go.mod requires when Render's is older.
  - key: GOTOOLCHAIN
    value: auto
  - key: OPENAI_VERIFICATION_TOKEN
    sync: false
  - key: OAUTH_INTROSPECTION_SERVICE_TOKEN
    sync: false
  - key: REDIS_URL
    fromService:
      name: mcp-kv
      type: keyvalue
      property: connectionString
- type: keyvalue
  name: mcp-kv
  ipAllowList: []
